learning_rate: 2e-4
num_train_epochs: 3
warmup_ratio: 0.01
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4

eval_strategy: steps
eval_steps: 0.25
save_strategy: steps
save_steps: 0.25
logging_steps: 10

optim: paged_adamw_8bit
lr_scheduler_type: cosine
weight_decay: 0.01
max_grad_norm: 0.3

bf16: true
gradient_checkpointing: true
