# ─── LoRA / QLoRA Configuration ──────────────────────────────────────────────
# Phase 2: Fine-tuning Gemma-3 for Hindi triple extraction
# Designed for Google Colab Pro (T4 GPU, 16GB VRAM)

model:
  model_id: "google/gemma-3-2b-it"        # Use 1b-it for faster iteration, 4b-it for best quality
  use_4bit: true                           # QLoRA: 4-bit quantization (required for T4)
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16                                    # LoRA rank (16 is a good default; try 8 or 32)
  lora_alpha: 32                           # Usually 2 * r
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "outputs/models/gemma3_hindi_triples"
  num_train_epochs: 3
  per_device_train_batch_size: 2           # Keep low for T4 memory
  gradient_accumulation_steps: 8          # Effective batch size = 2 * 8 = 16
  learning_rate: 2.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  optim: "paged_adamw_8bit"              # Memory-efficient optimizer
  max_seq_length: 512
  fp16: false
  bf16: true                             # Use bfloat16 on T4
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
  save_total_limit: 3
  load_best_model_at_end: true
  report_to: "none"                      # Set to "wandb" if you use W&B

data:
  train_file: "data/training/train_instruction_pairs.jsonl"
  val_file: "data/training/val_instruction_pairs.jsonl"
  prompt_template: "iterative"           # "simultaneous" | "iterative" (use iterative for MILIE-inspired design)
  max_train_samples: null                # null = use all
  max_val_samples: 50

seed: 42

# ─── Evaluation Config ────────────────────────────────────────────────────────
evaluation:
  benchie_data: "data/raw/hindi_benchie_test.jsonl"
  use_essential_triples: true
  use_compensatory_triples: true
  alignment_threshold: 0.45            # Below this → HITL review
  ontology_properties: "data/ontology/dbpedia_properties.json"
  output_dir: "outputs/results"

# ─── Notes for Colab ─────────────────────────────────────────────────────────
# Memory tips for T4 (16GB):
#   - gemma-3-1b-it + 4bit: ~4GB VRAM  (safe)
#   - gemma-3-2b-it + 4bit: ~6GB VRAM  (safe)
#   - gemma-3-4b-it + 4bit: ~10GB VRAM (safe with gradient_accumulation)
#   - gemma-3-4b-it + 8bit: ~14GB VRAM (tight, watch for OOM)
#
# If OOM: reduce per_device_train_batch_size to 1, increase gradient_accumulation_steps
